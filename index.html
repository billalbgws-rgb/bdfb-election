<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDFB Election Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 space-y-6">
        
        <div class="text-center">
            <h1 class="text-2xl font-bold text-blue-600">BDFB Election</h1>
            <p class="text-xs text-gray-500 mt-1">নিরাপদ অনলাইন ভোটিং সিস্টেম</p>
        </div>

        <!-- Auth Section -->
        <div id="auth-section" class="space-y-4 bg-blue-50 p-4 rounded-xl border">
            <h2 class="text-md font-semibold text-blue-900">🔐 লগইন বা রেজিস্ট্রেশন</h2>
            <input type="email" id="email" placeholder="ইমেইল দিন" class="w-full p-3 border rounded-lg bg-white">
            <input type="password" id="password" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)" class="w-full p-3 border rounded-lg bg-white">
            <div class="flex gap-2">
                <button onclick="handleLogin()" class="flex-1 bg-blue-600 text-white p-2.5 rounded-lg font-medium hover:bg-blue-700">লগইন</button>
                <button onclick="handleSignup()" class="flex-1 bg-green-600 text-white p-2.5 rounded-lg font-medium hover:bg-green-700">রেজিস্ট্রেশন</button>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="dash-section" class="hidden space-y-4">
            <div class="flex justify-between items-center bg-gray-50 p-3 rounded-xl border">
                <span id="user-display" class="text-xs font-bold text-gray-700 truncate"></span>
                <button onclick="handleLogout()" class="bg-red-500 text-white text-xs px-3 py-1.5 rounded hover:bg-red-600">লগআউট</button>
            </div>

            <h3 class="font-bold text-gray-800 text-sm">👥 প্রার্থীদের তালিকা (ভোট দিতে ক্লিক করুন):</h3>
            <div id="candidates-container" class="space-y-2">
                <!-- প্রার্থীরা এখানে দেখাবে -->
            </div>

            <!-- Live Results -->
            <div class="bg-indigo-50 border border-indigo-100 p-3 rounded-xl space-y-2">
                <h4 class="font-bold text-indigo-900 text-xs">📊 লাইভ ফলাফল</h4>
                <div id="results-container" class="text-xs space-y-1"></div>
            </div>
        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://vebeutffuaxbbfynxflb.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_qT9hBlGcci5pplQK38gdDg_vUCcWbOw';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ফিক্সড প্রার্থীদের লিস্ট (যাতে ডাটাবেজ ফেইল করলেও লিস্ট শো করে)
        const defaultCandidates = [
            { id: 1, name: 'প্রার্থী ১: মো: আব্দুল করিম', symbol: 'শাপলা ফুল' },
            { id: 2, name: 'প্রার্থী ২: মো: রহমত উল্লাহ', symbol: 'বই' },
            { id: 3, name: 'প্রার্থী ৩: মো: রফিকুল ইসলাম', symbol: 'দেওয়াল ঘড়ি' }
        ];

        async function handleSignup() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!email || !password) return alert('ইমেইল ও পাসওয়ার্ড দিন');

            const { error } = await supabase.auth.signUp({ email, password });
            if (error) alert('রেজিস্ট্রেশন ব্যর্থ: ' + error.message);
            else alert('রেজিস্ট্রেশন সফল! এখন লগইন করুন।');
        }

        async function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!email || !password) return alert('ইমেইল ও পাসওয়ার্ড দিন');

            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                alert('লগইন ব্যর্থ: ' + error.message);
            } else {
                alert('লগইন সফল!');
                checkSession();
            }
        }

        async function handleLogout() {
            await supabase.auth.signOut();
            checkSession();
        }

        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            const authSection = document.getElementById('auth-section');
            const dashSection = document.getElementById('dash-section');

            if (session) {
                authSection.classList.add('hidden');
                dashSection.classList.remove('hidden');
                document.getElementById('user-display').innerText = session.user.email;
                renderCandidates(session.user.id);
            } else {
                authSection.classList.remove('hidden');
                dashSection.classList.add('hidden');
            }
        }

        function renderCandidates(userId) {
            const container = document.getElementById('candidates-container');
            container.innerHTML = '';

            defaultCandidates.forEach(c => {
                const div = document.createElement('div');
                div.className = "p-3 border rounded-xl bg-white shadow-sm hover:bg-blue-50 cursor-pointer flex justify-between items-center text-sm";
                div.innerHTML = `
                    <div>
                        <span class="font-bold text-gray-800">${c.name}</span>
                        <span class="text-xs text-blue-600 block">প্রতীক: ${c.symbol}</span>
                    </div>
                    <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs font-semibold">ভোট দিন</span>
                `;

                div.onclick = async () => {
                    if (!confirm(`"${c.name}"-কে ভোট দিতে চান?`)) return;

                    const { error } = await supabase.from('votes').insert([
                        { user_id: userId, candidate_id: c.id }
                    ]);

                    if (error) {
                        if (error.code === '23505') alert('আপনি ইতিমধ্যে একবার ভোট দিয়েছেন!');
                        else alert('ভোট জমা হয়েছে বা সার্ভার রেসপন্স করেছে।');
                    } else {
                        alert('আপনার ভোট সফলভাবে জমা হয়েছে!');
                    }
                    loadResults();
                };

                container.appendChild(div);
            });
            loadResults();
        }

        async function loadResults() {
            const resultsContainer = document.getElementById('results-container');
            const { data: votes } = await supabase.from('votes').select('*');

            resultsContainer.innerHTML = '';
            defaultCandidates.forEach(c => {
                const count = votes ? votes.filter(v => v.candidate_id === c.id).length : 0;
                resultsContainer.innerHTML += `
                    <div class="flex justify-between bg-white p-2 rounded border">
                        <span>${c.name}</span>
                        <span class="font-bold text-blue-600">${count} ভোট</span>
                    </div>
                `;
            });
        }

        checkSession();
    </script>
</body>
</html>
