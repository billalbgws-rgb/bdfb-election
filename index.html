<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDFB Election Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-6">
        <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">BDFB Election</h1>

        <!-- Auth Box -->
        <div id="auth-box" class="space-y-4">
            <h2 class="text-lg font-semibold text-gray-700">লগইন বা রেজিস্ট্রেশন</h2>
            <input type="email" id="email" placeholder="ইমেইল দিন" class="w-full p-3 border rounded-lg">
            <input type="password" id="password" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)" class="w-full p-3 border rounded-lg">
            <div class="flex gap-2">
                <button onclick="handleLogin()" class="flex-1 bg-blue-600 text-white p-3 rounded-lg font-medium">লগইন</button>
                <button onclick="handleSignup()" class="flex-1 bg-green-600 text-white p-3 rounded-lg font-medium">রেজিস্ট্রেশন</button>
            </div>
        </div>

        <!-- Dashboard Box -->
        <div id="dash-box" class="hidden space-y-4">
            <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg">
                <span id="user-display" class="text-sm font-semibold text-gray-700"></span>
                <button onclick="handleLogout()" class="bg-red-500 text-white text-xs px-3 py-1.5 rounded">লগআউট</button>
            </div>
            <h3 class="font-bold text-gray-800">প্রার্থীদের তালিকা (ভোট দিতে ক্লিক করুন):</h3>
            <div id="candidates" class="space-y-2"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://vebeutffuaxbbfynxflb.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_qT9hBlGcci5pplQK38gdDg_vUCcWbOw';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function handleSignup() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!email || !password) return alert('ইমেইল ও পাসওয়ার্ড দিন');

            const { data, error } = await supabase.auth.signUp({ email, password });
            if (error) {
                alert('রেজিস্ট্রেশন ব্যর্থ: ' + error.message);
            } else {
                alert('রেজিস্ট্রেশন সফল! এখন লগইন করুন।');
            }
        }

        async function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!email || !password) return alert('ইমেইল ও পাসওয়ার্ড দিন');

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                alert('লগইন ব্যর্থ: ' + error.message);
            } else {
                alert('লগইন সফল!');
                checkSession();
            }
        }

        async function handleLogout() {
            await supabase.auth.signOut();
            checkSession();
        }

        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            const authBox = document.getElementById('auth-box');
            const dashBox = document.getElementById('dash-box');

            if (session) {
                authBox.classList.add('hidden');
                dashBox.classList.remove('hidden');
                document.getElementById('user-display').innerText = session.user.email;
                loadCandidates(session.user.id);
            } else {
                authBox.classList.remove('hidden');
                dashBox.classList.add('hidden');
            }
        }

        async function loadCandidates(userId) {
            const container = document.getElementById('candidates');
            const { data, error } = await supabase.from('candidates').select('*');
            
            if (error) {
                container.innerHTML = '<p class="text-red-500 text-sm">প্রার্থী লোড করা যায়নি।</p>';
                return;
            }

            container.innerHTML = '';
            data.forEach(c => {
                const div = document.createElement('div');
                div.className = "p-3 border rounded-lg bg-white shadow-sm hover:bg-blue-50 cursor-pointer flex justify-between items-center";
                div.innerHTML = `<span><b>${c.name}</b> (${c.symbol})</span> <span class="text-xs bg-blue-100 text-blue-600 px-2 py-1 rounded">ভোট দিন</span>`;
                
                div.onclick = async () => {
                    if (!confirm(`${c.name}-কে ভোট দিতে চান?`)) return;
                    
                    const { error: voteErr } = await supabase.from('votes').insert([{ user_id: userId, candidate_id: c.id }]);
                    if (voteErr) {
                        if (voteErr.code === '23505') alert('আপনি ইতিমধ্যে ভোট দিয়েছেন!');
                        else alert('ভোট জমা হয়নি: ' + voteErr.message);
                    } else {
                        alert('আপনার ভোট সফলভাবে জমা হয়েছে!');
                    }
                };
                container.appendChild(div);
            });
        }

        checkSession();
    </script>
</body>
</html>
